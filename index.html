<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Weather App Ui Design</title>
</head>

<body>

    <div class="container">
        <div class="left-info">
            <div class="pic-gradient"></div>
            <div class="today-info">
                <h2 id="current-day">Loading...</h2>
                <span id="current-date">Loading weather</span>
                <div>
                    <i class='bx bx-current-location'></i>
                    <span id="current-location">—</span>
                </div>
            </div>
            <div class="today-weather">
                <i id="current-weather-icon" class='bx bx-cloud'></i>
                <h1 id="current-temperature" class="weather-temp">
                    —
                </h1>
                <h3 id="current-condition">Loading...</h3>
            </div>
        </div>

        <div class="right-info">
            <div class="day-info">
                <div>
                    <span class="title">PRECIPITATION</span>
                    <span id="precipitation" class="value">—</span>
                </div>
                <div>
                    <span class="title">HUMIDITY</span>
                    <span id="humidity" class="value">—</span>
                </div>
                <div>
                    <span class="title">WIND SPEED</span>
                    <span id="wind-speed" class="value">—</span>
                </div>
            </div>

            <ul id="forecast-list" class="days-list" aria-label="Four-day forecast"></ul>

            <form id="search-form" class="btn-container">
                <label class="sr-only" for="city-search">City name</label>
                <input id="city-search" class="city-search" type="search" placeholder="Search city" value="Delhi" required>
                <button class="loc-button" type="submit">Search Location</button>
            </form>
            <p id="weather-status" class="weather-status" role="status" aria-live="polite"></p>

        </div>

    </div>
      
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
